[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "android", "ios", "xtask", "docs/demo/scripts"]
default-members = ["crates/*", "apps/ergonote", "apps/ergonote-cli", "apps/ergonote-setup", "xtask"]

[workspace.package]
version = "2026.11.26"
edition = "2024"
rust-version = "1.95"
license = "LicenseRef-ErgoNote-Freeware"
repository = "https://github.com/Masterz42/ErgoNote"
publish = false

[workspace.dependencies]
ergonote-model = { path = "crates/model" }
ergonote-math = { path = "crates/math" }
ergonote-diagram = { path = "crates/diagram" }
ergonote-ink = { path = "crates/ink" }
ergonote-formats = { path = "crates/formats" }
ergonote-text = { path = "crates/text" }
ergonote-onenote = { path = "crates/onenote" }
ergonote-import = { path = "crates/import" }
ergonote-store = { path = "crates/store" }
ergonote-engine = { path = "crates/engine" }
ergonote-mcp = { path = "crates/mcp" }
ergonote-ui-egui = { path = "crates/ui-egui" }
craft-i18n = { git = "https://github.com/storytold/craft-libs", rev = "92d392cff132eaf53e13afff77f38b5c11b73aa0" }

# Versions match the sibling Craft apps (storytold/wordcraft).
eframe = "0.37"
egui = { version = "0.37", features = ["default_fonts"] }
egui_extras = { version = "0.37", default-features = false, features = ["image", "gif", "file", "svg_text"] }
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }
serde_json = "1"
zip = "4"
# Equations: a pure Rust, KaTeX compatible TeX maths typesetter. Pinned exactly, because it is
# 0.x and young; the adapter in crates/math is the only place that names it.
# Diagrams: a pure Rust Mermaid renderer. Pinned exactly, because it is 0.x and young; only
# crates/diagram names it.
mermaid-rs-renderer = { version = "=0.3.1", default-features = false }
ratex-parser = "=0.1.15"
ratex-layout = "=0.1.15"
ratex-types = "=0.1.15"
ratex-font = "=0.1.15"
# Build time only, Windows only: puts the icon and the version into the .exe files.
winresource = "0.1"
# The system file and folder dialogs, for "Open a notebook folder". UI only.
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
# The system clipboard: HTML plus its plain-text alternative, pictures and files. Keep
# Wayland data-control enabled so rich clipboard writes reach native Wayland applications.
arboard = { version = "3.7", default-features = false, features = ["image-data", "wayland-data-control"] }
# The log facade. The app routes it into its log file (apps/ergonote/src/applog.rs).
log = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# OneNote packages (.onepkg) are Windows cabinet files, usually LZX compressed (issue #17).
# Pure Rust, reading only; only crates/import names it.
cab = "0.6"
# JPEG XL pictures (issue #29): a pure Rust decoder. It plugs into `image` through image's decoding
# hooks, so egui_extras' loader draws a .jxl like any other picture. Decoding only; ErgoNote never
# writes JPEG XL.
jxl-oxide = { version = "0.12", default-features = false, features = ["image"] }
ocrs = { version = "0.14", default-features = false, features = ["rten"] }
rten = { version = "0.28", default-features = false, features = ["rten_format"] }
oar-ocr = { version = "0.11.0", default-features = false, features = ["simd"] }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["download-binaries", "tls-rustls"] }
hayro = { version = "=0.5.0", default-features = false, features = ["embed-fonts"] }
# A drop-in SystemTime/Instant: std's own panics with "time not implemented on this
# platform" on wasm32-unknown-unknown, which has no clock. This is std's types everywhere
# else and Date.now() there, with no wasm-bindgen glue needed in ergonote-model itself.
web-time = "1.1"
# The user's UTC offset, read once when the desktop app starts, so timestamps are shown on
# the user's clock. Already in the tree through zip; only the app names it.
time = { version = "0.3", default-features = false, features = ["std", "local-offset"] }

# Mermaid 0.3.1 uses std::time::Instant in its layout metrics on the ordinary render path.
# Those metrics are discarded by ErgoNote, but Instant::now() panics on wasm32-unknown-unknown.
# Keep the upstream crate local until its WASM-safe timer fix is released.
[patch.crates-io]
mermaid-rs-renderer = { path = "vendor/mermaid-rs-renderer" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev]
opt-level = 0
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
debug = 0


