[package]
name = "ergonote-text"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "ErgoNote text layer (spike): shaping, bidi and a caret, over parley"

[lints]
workspace = true

[dependencies]
ergonote-model = { workspace = true }
# No `system` feature: fontique's system backend links fontconfig on Linux. ErgoNote
# registers the faces it bundles, the way PhotoCraft does.
parley = { version = "0.11", default-features = false, features = ["std"] }
