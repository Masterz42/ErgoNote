[package]
name = "notecraft-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Mon Cartable - Version Web / iPad Safari (WebAssembly)"

[lints]
workspace = true

[dependencies]
notecraft-engine = { workspace = true }
notecraft-store = { workspace = true }
notecraft-ui-egui = { workspace = true }
notecraft-model = { workspace = true }
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
egui = { workspace = true }
log = { workspace = true }
web-sys = { version = "0.3", features = ["Document", "Window", "Location", "Element", "HtmlCanvasElement", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url"] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
