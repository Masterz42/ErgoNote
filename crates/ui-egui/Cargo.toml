[package]
name = "ergonote-ui-egui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "ErgoNote egui front end. Swappable: nothing below it depends on egui"

[lints]
workspace = true

[dependencies]
craft-i18n = { workspace = true }
ergonote-input-language = { path = "../input-language" }
ergonote-model = { workspace = true }
ergonote-ink = { workspace = true }
ergonote-text = { workspace = true }
ergonote-math = { workspace = true }
ergonote-formats = { workspace = true }
ergonote-store = { workspace = true }
ergonote-engine = { workspace = true }
ergonote-import = { workspace = true }
egui = { workspace = true }
egui_extras = { workspace = true }
ergonote-diagram = { workspace = true }
image = { workspace = true }
jxl-oxide = { workspace = true }
hayro = { workspace = true }
kurbo = { version = "0.12.0", default-features = false }
log = { workspace = true }
serde_json = { workspace = true }
zip = { workspace = true }
# File > Check for updates: release versions and the SHA-256 of a download (see `update.rs`).
semver = "1"
sha2 = "0.10"
spellbook = "0.4.2"
# SystemTime::now()/Instant::now() panic on wasm32-unknown-unknown; see the workspace Cargo.toml.
web-time = { workspace = true }

# The system file dialogs and the system clipboard. Android has neither through these crates:
# its file picker and clipboard are Java services (see `filepicker.android.rs` and
# `clipboard.android.rs`), so the window says they are missing there instead.
[target.'cfg(not(any(target_os = "android", target_os = "ios", target_arch = "wasm32")))'.dependencies]
rfd = { workspace = true }
arboard = { workspace = true }

[target.'cfg(any(target_os = "linux", target_os = "windows", target_os = "macos"))'.dependencies]
fontdb = "0.23"
# File > About > "Check for updates": asks GitHub for the newest release, downloads the file for
# this computer and checks it against the release's SHA-256 before running it. Nothing is sent
# until the button is pressed.
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier", "json"] }
oar-ocr = { workspace = true }
ort = { workspace = true }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ocrs = { workspace = true }
rten = { workspace = true }

[dev-dependencies]
egui_kittest = { workspace = true }
# The icon tests share one offscreen GPU device instead of building one per picture.
egui-wgpu = "0.37"


