[package]
name = "ergonote-import"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "ErgoNote importer: turns a folder of OneNote section files into a ErgoNote notebook tree, in HTML or CommonMark + GFM pages. Read only on the source"

[lints]
workspace = true

[dependencies]
ergonote-model = { workspace = true }
ergonote-formats = { workspace = true }
ergonote-onenote = { workspace = true }
ergonote-store = { workspace = true }
cab = { workspace = true }

[dev-dependencies]
ergonote-onenote = { workspace = true, features = ["testing"] }
